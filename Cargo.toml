[package]
name = "brass_control_server"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
